[project]
name = "nonlinearembeddvqc-fourier"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mpi4py>=4.1.1",
    "pennylane==0.40.0",
    "scipy>=1.15.3",
    "torch>=2.1.2",
    "torchvision>=0.16.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu122", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu122", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu122"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
